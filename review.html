<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-7hKVwjwpfokFBdeIokHbIMZYhaa6RE7Xa9HaCfouA04='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://ssuescpqyhuqkphauwde.supabase.co wss://ssuescpqyhuqkphauwde.supabase.co; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#c2410c">
<title>Spruce Review · EduSpruce</title>
<link rel="icon" href="favicon.png">
<style>
:root{--acc:#c2410c;--acc2:#fff1e8;--ink:#1c1917;--mut:#57534e;--line:#e7e5e4;--bg:#f7f5f3;--panel:#fff;--ok:#15803d;--bad:#b91c1c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--acc:#fb923c;--acc2:#3a2416;--ink:#f5f5f4;--mut:#a8a29e;--line:#3a3532;--bg:#151311;--panel:#1f1c1a;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
.top{display:flex;gap:10px;align-items:center;font-size:18px;margin-bottom:14px}.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800}.top em{font-style:normal;color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px;display:flex;gap:8px;align-items:center}.sp{flex:1}.mut{color:var(--mut)}
.nota{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.nota b{font-size:44px;line-height:1;color:var(--acc)}
.cr{display:grid;grid-template-columns:150px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}.cr:first-of-type{border-top:0}
.cr img{width:150px;height:84px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.pt{font-weight:800;white-space:nowrap}.cm{margin-top:6px;padding:8px 10px;background:var(--acc2);border-radius:8px}
.niv{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line)}
.fig{position:relative;line-height:0;margin:10px 0}.fig img{width:100%;border-radius:8px;display:block}.anot{position:absolute;inset:0;width:100%;height:100%}
.atxt{position:absolute;transform:translate(-50%,-50%);color:#fff;font:700 12px/1.3 system-ui;padding:2px 6px;border-radius:4px;white-space:nowrap}
.cap{font-size:13px;color:var(--mut);margin-bottom:12px}
select,textarea,input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}textarea{width:100%}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:var(--acc);color:#fff;cursor:pointer}.btn:disabled{opacity:.6}
.lupa{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.lupa img{max-width:100%;max-height:100%;border-radius:8px;background:#fff}
.err{color:var(--bad)}.ok{color:var(--ok)}audio{width:100%;max-width:420px;margin-top:6px}
.rod{font-size:12px;color:var(--mut);text-align:center;margin:20px 0}
@media (max-width:640px){.cr{grid-template-columns:1fr auto}.cr>.ref{grid-column:1/-1}.cr img{width:100%;height:auto}}
</style>
</head>
<body>
<main>
  <header class="top"><span class="logo" aria-hidden="true">S</span><b>Edu<em>Spruce</em> · Spruce Review</b></header>
  <div id="app" aria-live="polite"><p class="card">A abrir…</p></div>
  <p class="rod">Só tu e o teu professor veem esta página. Nada fica guardado neste aparelho. <a href="privacidade.html#alunos" target="_blank" rel="noopener" style="color:inherit">Privacidade</a></p>
</main>
<noscript><p class="card">É preciso ativar o JavaScript no navegador.</p></noscript>
<script>
'use strict';
const $=s=>document.querySelector(s);const te=new TextEncoder(),td=new TextDecoder();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=v=>v==null||v===''?'—':(Math.round(v*10)/10).toString().replace('.',',');
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const NIV=[[0,'Não fez',0],[1,'Insuficiente',.25],[2,'Suficiente',.5],[3,'Bom',.75],[4,'Muito bom',1]];
const nivel=(v,m)=>{if(v==null||v===''||!m)return -1;const r=v/m;return r<=0?0:r<=.3?1:r<=.6?2:r<=.85?3:4};
let CFG=null;
async function cfg(){if(CFG)return CFG;const r=await fetch('supabase-config.json',{cache:'no-store'});if(!r.ok)throw new Error('config');CFG=await r.json();return CFG}
async function rpc(fn,args){const c=await cfg();const r=await fetch(c.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:c.anonKey,Authorization:'Bearer '+c.anonKey},body:JSON.stringify(args)});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(_){}if(!r.ok){const e=new Error((j&&j.message)||('Erro '+r.status));e.status=r.status;throw e}return j}
async function chaves(code){const id=hex(await crypto.subtle.digest('SHA-256',te.encode('es-rv-id:'+code))).slice(0,40);
  const base=await crypto.subtle.importKey('raw',te.encode(code),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('es-rv-k:'+id),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);return {id,k}}
async function cifrar(o,k){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(o)));return 'A1.'+b64(iv)+'.'+b64(ct)}
async function decifrar(s,k){const p=String(s).split('.');if(p[0]!=='A1')throw new Error('formato');const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(p[1])},k,unb64(p[2]));return JSON.parse(td.decode(pt))}
const safeSrc=s=>/^(data:image\/(webp|jpeg|png);base64,|https:\/\/|review\/ref\/([\w-]+\/)?[\w-]+\.webp$)/.test(String(s||''))?String(s):'';
const safeAud=s=>/^data:audio\/[\w.+-]+(;codecs=[\w.]+)?;base64,/.test(String(s||''))?String(s):'';
function svgAnot(L){const X=v=>Math.round((+v||0)*1000);const cor=c=>/^#[0-9a-f]{3,6}$/i.test(c||'')?c:'#e11d48';
  return `<svg class="anot" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="context-stroke"/></marker></defs>${(Array.isArray(L)?L:[]).map(a=>{const c=cor(a.c);
    if(a.k==='seta')return `<line x1="${X(a.x)}" y1="${X(a.y)}" x2="${X(a.x2)}" y2="${X(a.y2)}" stroke="${c}" stroke-width="6" marker-end="url(#ah)" vector-effect="non-scaling-stroke"/>`;
    if(a.k==='circ')return `<ellipse cx="${X((a.x+a.x2)/2)}" cy="${X((a.y+a.y2)/2)}" rx="${Math.abs(X(a.x2-a.x))/2}" ry="${Math.abs(X(a.y2-a.y))/2}" fill="none" stroke="${c}" stroke-width="4" vector-effect="non-scaling-stroke"/>`;
    if(a.k==='ret')return `<rect x="${X(Math.min(a.x,a.x2))}" y="${X(Math.min(a.y,a.y2))}" width="${Math.abs(X(a.x2-a.x))}" height="${Math.abs(X(a.y2-a.y))}" fill="none" stroke="${c}" stroke-width="4" vector-effect="non-scaling-stroke"/>`;return ''}).join('')}</svg>${(Array.isArray(L)?L:[]).filter(a=>a.k==='txt').map(a=>`<span class="atxt" style="left:${Math.max(0,Math.min(1,+a.x||0))*100}%;top:${Math.max(0,Math.min(1,+a.y||0))*100}%;background:${cor(a.c)}">${esc(a.t)}</span>`).join('')}`}
let S={};
function lupa(src){const d=document.createElement('div');d.className='lupa';d.innerHTML=`<img src="${esc(src)}" alt="">`;d.addEventListener('click',()=>d.remove());document.body.appendChild(d)}
function ecra(html){$('#app').innerHTML=html;document.querySelectorAll('[data-lupa]').forEach(i=>i.addEventListener('click',()=>lupa(i.dataset.lupa)))}
function erro(m){ecra(`<div class="card"><h1>Não foi possível abrir</h1><p class="err">${esc(m)}</p><p class="mut">Confirma a ligação que o professor te deu.</p></div>`)}
async function abrir(){const code=(location.hash||'').replace('#','').trim().toUpperCase();if(!/^[2-9A-Z]{6,16}$/.test(code))return erro('Ligação incompleta.');
  try{const {id,k}=await chaves(code);let L;try{L=await rpc('eduspruce_autoav_ler',{p_id:id})}catch(e){if(e.status===404)return erro('Esta funcionalidade ainda não está ativa.');throw e}
    if(!Array.isArray(L)||!L.length)return erro('Esta página já não está disponível (terminou o prazo ou o professor retirou-a).');
    const D=await decifrar(L[0].dados,k);S={id,k,D,exp:L[0].expira};desenhar()}catch(e){erro(e.message==='formato'||/decrypt|operation/i.test(e.message)?'Ligação inválida.':e.message)}}
function desenhar(){const D=S.D;const fb=D.fb;const C=Array.isArray(D.crit)?D.crit:[];const doms=Array.isArray(D.doms)?D.doms:[];
  let h=`<div class="card"><h1>${esc(D.t)}</h1><p class="mut" style="margin:0">Tecnologias da Informação e Comunicação · Módulo 03${D.cur?' · Curso Profissional de '+esc(D.cur):''}</p><p class="mut" style="margin:0">${esc(D.nm)}${D.url?' · '+esc(D.url):''}${D.prof?' · Professor: '+esc(D.prof):''}</p>
    ${fb?`<div class="nota" style="margin-top:12px"><b>${nf(fb.val)}</b><span>valores<br><span class="mut">${nf(fb.tot)} de ${nf(D.mx)} pontos</span></span></div>`:''}
    ${fb&&fb.g?`<div class="cm" style="margin-top:12px"><b>Apreciação geral:</b> ${esc(fb.g)}</div>`:''}${fb&&fb.aud&&safeAud(fb.aud._g)?`<audio controls src="${esc(safeAud(fb.aud._g))}"></audio>`:''}</div>`;
  doms.forEach((d,di)=>{const L=C.filter(c=>c.dom===di);if(!L.length)return;const s=fb?L.reduce((x,c)=>x+(+fb.pts[c.id]||0),0):null;const m=L.reduce((x,c)=>x+(+c.pts||0),0);
    h+=`<div class="card"><h2>${esc(d)}<span class="sp"></span>${fb?`<span class="pt">${nf(s)} / ${nf(m)}</span>`:`<span class="mut">${nf(m)} pts</span>`}</h2>${L.map(c=>{const v=fb?fb.pts[c.id]:null;const nv=nivel(v,c.pts);const ref=c.ref&&/^([\w-]+\/)?[\w-]+$/.test(c.ref)?'review/ref/'+(c.ref.includes('/')?'':'agro/')+c.ref+'.webp':'';
      const shots=fb?(fb.shots||[]).filter(s=>s.crit===c.id&&safeSrc(s.src)):[];const au=fb&&fb.aud?safeAud(fb.aud[c.id]):'';
      return `<div class="cr"><div class="ref">${ref?`<img src="${ref}" alt="Exemplo correto: ${esc(c.n)}" data-lupa="${ref}" loading="lazy"><div class="mut" style="font-size:11px">✓ exemplo correto</div>`:''}</div>
        <div><b>${esc(c.n)}</b><div class="mut" style="font-size:14px">${esc(c.desc)}</div>${fb&&fb.com&&fb.com[c.id]?`<div class="cm">${esc(fb.com[c.id])}</div>`:''}${au?`<audio controls src="${esc(au)}"></audio>`:''}
        ${shots.map(s=>`<div class="fig"><img src="${esc(safeSrc(s.src))}" alt="">${svgAnot(s.anot)}</div><div class="cap">${esc(s.cap)}</div>`).join('')}</div>
        <div style="text-align:right">${fb?`<div class="pt">${nf(v)} / ${nf(c.pts)}</div>${nv>=0?`<span class="niv">${NIV[nv][1]}</span>`:''}`:`<span class="mut">${nf(c.pts)} pts</span>`}</div></div>`}).join('')}</div>`});
  const outras=fb?(fb.shots||[]).filter(s=>!s.crit&&safeSrc(s.src)):[];if(outras.length)h+=`<div class="card"><h2>Capturas comentadas</h2>${outras.map(s=>`<div class="fig"><img src="${esc(safeSrc(s.src))}" alt="">${svgAnot(s.anot)}</div><div class="cap">${esc(s.cap)}</div>`).join('')}</div>`;
  if(D.aa)h+=`<div class="card" id="aa"><h2>A tua autoavaliação</h2><p class="mut" style="margin-top:0">Para cada critério, escolhe o nível que achas que mereces. O professor vai comparar com a correção dele.</p>
    ${C.map(c=>`<div class="cr" style="grid-template-columns:1fr auto"><div><b>${esc(c.n)}</b> <span class="mut">(${nf(c.pts)} pts)</span></div><select data-aa="${esc(c.id)}" aria-label="Nível em ${esc(c.n)}"><option value="">—</option>${NIV.map(([n,l,f])=>`<option value="${f}">${l} (${nf((+c.pts||0)*f)})</option>`).join('')}</select></div>`).join('')}
    <label><b>O que correu melhor no teu site?</b></label><textarea id="aa-r" rows="3" maxlength="2000"></textarea><label><b>O que queres melhorar?</b></label><textarea id="aa-c" rows="3" maxlength="2000"></textarea>
    <p id="aa-tot" class="mut"></p><button class="btn" id="aa-ok">Enviar autoavaliação</button> <span id="aa-m"></span></div>`;
  ecra(h);
  if(D.aa){const tot=()=>{let t=0;document.querySelectorAll('[data-aa]').forEach(s=>{const c=C.find(x=>x.id===s.dataset.aa);if(s.value!=='')t+=(+c.pts||0)*(+s.value)});$('#aa-tot').textContent='A tua nota estimada: '+nf(D.mx?t/D.mx*20:0)+' valores'};
    document.querySelectorAll('[data-aa]').forEach(s=>s.addEventListener('change',tot));tot();
    $('#aa-ok').addEventListener('click',async()=>{const b=$('#aa-ok');const pts={};let n=0;document.querySelectorAll('[data-aa]').forEach(s=>{if(s.value==='')return;const c=C.find(x=>x.id===s.dataset.aa);pts[c.id]=Math.round((+c.pts||0)*(+s.value)*2)/2;n++});
      if(n<C.length&&!confirm('Faltam '+(C.length-n)+' critérios. Enviar mesmo assim?'))return;b.disabled=true;$('#aa-m').textContent='A enviar…';
      try{const ok=await rpc('eduspruce_autoav_enviar',{p_id:S.id,p_conteudo:await cifrar({rv:1,pts,refl:$('#aa-r').value.slice(0,2000),com:$('#aa-c').value.slice(0,2000)},S.k)});
        if(ok===false)throw new Error('A página já está fechada.');$('#aa-m').innerHTML='<span class="ok">✓ Enviada! Podes voltar a enviar se mudares de ideias.</span>'}catch(e){$('#aa-m').innerHTML='<span class="err">'+esc(e.message)+'</span>'}b.disabled=false})}}
addEventListener('hashchange',abrir);abrir();
</script>
</body>
</html>
