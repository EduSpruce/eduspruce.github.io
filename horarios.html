<style>html,body{margin:0;height:100%;font:15px system-ui,sans-serif}iframe{border:0;width:100%;height:100%;display:block}#msg{max-width:520px;margin:15vh auto;padding:24px;text-align:center}</style>
</head><body><div id="msg">A carregar…</div>
<script>
/* nunca dentro de uma página de outro sítio (proteção contra cliques enganados) */try{if(top!==self){let m=false;try{m=top.location.origin===location.origin}catch(_){}if(!m)document.documentElement.style.display='none'}}catch(_){}
/* EduSchedule · consulta pública dos horários publicados (sem conta): horarios.html#<código>[/<página>.html] */
const SB={"url":"https://ssuescpqyhuqkphauwde.supabase.co","anonKey":"sb_publishable_oNNwLRRXJmqDzBqQPlf9jw_N0L29FjV"};
const msg=t=>{document.body.innerHTML='<div id="msg">'+t+'</div>'};
async function ficheiro(c,n){const r=await fetch(SB.url+'/rest/v1/rpc/eduschedule_publico',{method:'POST',headers:{apikey:SB.anonKey,Authorization:'Bearer '+SB.anonKey,'Content-Type':'application/json'},body:JSON.stringify({p_codigo:c,p_nome:n})});if(!r.ok)throw new Error(r.status);return r.json()}
async function abrir(){
  const [c,...p]=(h=>{try{return decodeURIComponent(h)}catch(_){return h}})(location.hash.slice(1)).split('/');const n=p.join('/')||'index.html';
  if(!/^[0-9a-f]{24}$/.test(c))return msg('Endereço incompleto: falta o código dos horários.');
  let t;try{t=await ficheiro(c,n)}catch(e){return msg('Sem ligação. Tente outra vez daqui a pouco.')}
  if(typeof t!=='string')return msg('Ainda não há horários publicados neste endereço.');
  /* calendários: endereço fixo que se pode subscrever no telemóvel */
  t=t.replace(/href="(ics\/[\w.-]+\.ics)"/g,(_,f)=>'href="'+SB.url+'/functions/v1/eduschedule-ics?c='+c+'&f='+encodeURIComponent(f)+'" target="_blank" rel="noopener"');
  /* a página publicada é só para ler: abre sem poder correr código nem enviar formulários (sandbox sem allow-scripts) */
  const fr=document.createElement('iframe');fr.setAttribute('sandbox','allow-same-origin allow-popups allow-popups-to-escape-sandbox');fr.srcdoc=t;document.body.replaceChildren(fr);
  fr.onload=()=>{const d=fr.contentDocument;if(!d)return;document.title=d.title||document.title;
    d.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');if(/^[\w.-]+\.html$/.test(h)){e.preventDefault();location.hash=c+'/'+h}})}
}
addEventListener('hashchange',abrir);abrir();
</script></body></html>
