<script>/* números dos indicadores com o NumberFlow, como na EPISJ 360 */
(()=>{const V=new Map();let h=0;const corre=()=>{h=0;if(!(window.customElements&&customElements.get("number-flow")))return;
  document.querySelectorAll(".kpi .v").forEach(el=>{if(el.querySelector("number-flow"))return;const t=(el.textContent||"").trim().replace(/(\d)[\s\u00a0\u202f](?=\d{3}(?!\d))/g,"$1"),m=t.match(/^(\d+(?:[.,]\d+)?)\s?(%|k|M)?$/);if(!m)return;
    const k=((el.parentElement.querySelector(".l")||{}).textContent||""),end=parseFloat(m[1].replace(",",".")),prev=V.get(k);V.set(k,end);
    const f=document.createElement("number-flow");f.locales="pt-PT";if(m[2])f.numberSuffix=m[2];if(/[.,]/.test(m[1]))f.format={minimumFractionDigits:1,maximumFractionDigits:1};
    el.textContent="";el.appendChild(f);f.update(prev==null?0:prev);if(prev!==end)requestAnimationFrame(()=>requestAnimationFrame(()=>f.update(end)))})};
