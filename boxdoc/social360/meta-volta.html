<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social360 — ligação à Meta</title>
<style>@font-face{font-family:Poppins;font-weight:400;src:url(../fonts/poppins-latin-400.woff2) format("woff2")}@font-face{font-family:Poppins;font-weight:600;src:url(../fonts/poppins-latin-600.woff2) format("woff2")}
body{font-family:Poppins,system-ui,sans-serif;background:#f7f8fa;margin:0;display:grid;place-items:center;min-height:100vh;color:#222;padding:20px;box-sizing:border-box}
.c{background:#fff;border:1px solid #e4e7eb;border-radius:16px;padding:28px 30px;max-width:460px;width:100%;box-shadow:0 12px 32px rgba(16,24,40,.12)}h1{font-size:20px;margin:0 0 8px}p{margin:0 0 6px;color:#4f5661;line-height:1.5}
.i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px;margin-bottom:12px}</style></head>
<body><div class="c" id="c"></div>
<script>
const q=new URLSearchParams(location.search),ok=q.get('ok')==='1',esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.title=(q.get('t')||'Social360')+' — Social360';
document.getElementById('c').innerHTML=`<div class="i" style="background:${ok?'#1a5fd0':'#c62828'}">${ok?'✓':'!'}</div><h1>${esc(q.get('t')||'')}</h1>${q.getAll('i').map(x=>`<p>• <b>${esc(x)}</b></p>`).join('')}${q.get('m')?`<p${ok?' style="color:#8a5a00"':''}>${esc(q.get('m'))}</p>`:''}<p style="margin-top:12px;font-size:13px">Pode fechar esta janela e voltar ao Social360.</p>`;
try{window.opener&&window.opener.postMessage({s360meta:ok?'ok':'erro',n:+q.get('n')||0},location.origin)}catch(e){}
if(ok)setTimeout(()=>window.close(),2500);
</script></body></html>
