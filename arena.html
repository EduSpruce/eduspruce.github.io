<script>

async function cfg(){if(CFG)return CFG;let c=window.__ES_SB;if(!c||typeof c!=='object'){try{c=await (await fetch('supabase-config.json',{cache:'no-store'})).json()}catch(_){c=null}}if(!c||!c.url)throw new Error('A Arena não está configurada.');CFG=c;return c}

function ecraCodigo(msg,cod){paraTudo();ecra('codigo',`${topo()}<div class="card" style="margin-top:auto"><h1>Entra no jogo</h1><p class="mut">Escreve o código que está no quadro.</p><input id="cod" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" value="${esc(AR.fmt(cod||''))}" aria-label="Código da sala"><button class="btn" id="b-ok">Entrar</button><p class="err" id="e">${esc(msg||'')}</p></div><p class="mut centro peq" style="margin-bottom:auto">Não precisas de conta. Só guardamos a tua alcunha e as tuas respostas durante o jogo.</p>`);
  const i=$('#cod');i.oninput=()=>{const p=i.selectionStart;i.value=AR.fmt(AR.limpaCod(i.value));};i.onkeydown=e=>{if(e.key==='Enter')$('#b-ok').click()};if(!cod)setTimeout(()=>i.focus(),100);
  $('#b-ok').onclick=()=>abrir(AR.limpaCod(i.value))}
async function abrir(code){const e=$('#e'),b=$('#b-ok');if(code.length!==6){if(e)e.textContent='O código tem 6 carateres.';return}if(b){b.disabled=true;b.textContent='A procurar…'}
  try{st.code=code;st.id=await AR.salaId(code);history.replaceState(null,'','#'+code);
    const g=lerG(st.id);if(g&&g.j&&g.tok){Object.assign(st,g);const r=await rpc('arena_estado',{p_id:st.id,p_j:st.j,p_tok:st.tok});if(r&&!r.erro&&!r.eu.expulso){st.alcunha=r.eu.alcunha;comecar(r);return}esquecer()}
    const info=await rpc('arena_info',{p_id:st.id});if(!info){if(b){b.disabled=false;b.textContent='Entrar'}if(e)e.textContent=MSG.sala;return}st.info=info;ecraNome()}
  catch(x){if(b){b.disabled=false;b.textContent='Entrar'}if(e)e.textContent=x.message}}

    <label>A tua Pinha</label><div class="avs" id="avs">${AR.COMUNS.map(id=>`<button type="button" data-av="${id}" class="${st.avatar===id?'on':''}" aria-label="${esc(AR.pinha(id).nome)}">${AR.svg(id,56)}</button>`).join('')}</div>
    <button class="btn" id="b-ent">Entrar no jogo</button><p class="err" id="e"></p></div>`);
  let esc_=null;if(lista)document.querySelectorAll('#lst [data-k]').forEach(b=>b.onclick=()=>{esc_=L[+b.dataset.k];document.querySelectorAll('#lst [data-k]').forEach(z=>z.classList.toggle('on',z===b))});
  else{const a=$('#alc');a.value=st.alcunha||'';$('#b-dado').onclick=()=>{a.value=AR.SUGESTOES[Math.floor(Math.random()*AR.SUGESTOES.length)]+' '+(10+Math.floor(Math.random()*90))};a.onkeydown=e=>{if(e.key==='Enter')$('#b-ent').click()}}
  document.querySelectorAll('#avs [data-av]').forEach(b=>b.onclick=()=>{st.avatar=b.dataset.av;document.querySelectorAll('#avs [data-av]').forEach(z=>z.classList.toggle('on',z===b))});
  $('#b-ent').onclick=async()=>{const e=$('#e'),b=$('#b-ent');let alc,ref=null;if(lista){if(!esc_){e.textContent=MSG.lista;return}{const w=esc_.n.replace(/^\d+\.\s*/,'').split(/\s+/);alc=w[0]+(w.length>1?' '+w[w.length-1][0]+'.':'')}ref=esc_.r}else{alc=$('#alc').value.trim().replace(/\s+/g,' ');const m=AR.alcunhaOk(alc);if(m){e.textContent=m;return}}
    b.disabled=true;b.textContent='A entrar…';st.tok=st.tok||AR.token();
    try{const r=await rpc('arena_entrar',{p_id:st.id,p_alcunha:alc,p_tok:st.tok,p_ref:ref,p_avatar:st.avatar});if(!r||r.erro){b.disabled=false;b.textContent='Entrar no jogo';e.textContent=MSG[r&&r.erro]||'Não foi possível entrar.';return}
      st.j=r.j;st.alcunha=r.alcunha;st.ref=ref;guardar();AR.tocar('entra');AR.vibrar(30);const s=await rpc('arena_estado',{p_id:st.id,p_j:st.j,p_tok:st.tok});comecar(s)}
    catch(x){b.disabled=false;b.textContent='Entrar no jogo';e.textContent=x.message}}}

/* ---------- 3. ciclo do jogo ---------- */
function paraTudo(){clearTimeout(tPoll);clearInterval(tRel);tPoll=tRel=null;try{canal&&canal.unsubscribe()}catch(_){}canal=null}
async function ligarCanal(){try{const c=await cfg();const m=await import('./esm/supabase-2.117.3.min.js');const sb=m.createClient(c.url,c.anonKey,{auth:{persistSession:false,autoRefreshToken:false}});canal=sb.channel('arena-'+st.id,{config:{broadcast:{self:false}}});
  canal.on('broadcast',{event:'s'},()=>{clearTimeout(st.tAviso);st.tAviso=setTimeout(atualizar,120+Math.random()*450)}).subscribe()}catch(_){}}
function comecar(r){paraTudo();st.estado=r;st.livre=false;st.qAtual=null;ligarCanal();aplicar(r);agendar()}
function agendar(){clearTimeout(tPoll);const s=st.estado&&st.estado.sala;const vivo=s&&s.tipo==='vivo';const ms=!s?4000:s.estado==='fim'?20000:s.estado==='espera'?3000:(vivo&&s.modo==='classico')?2500:6000;tPoll=setTimeout(async()=>{await atualizar();agendar()},ms)}
async function atualizar(){if(!st.j)return;try{const r=await rpc('arena_estado',{p_id:st.id,p_j:st.j,p_tok:st.tok});semRede(false);if(r.erro==='jogador'){esquecer();return ecraCodigo('A tua ligação a esta sala terminou. Entra de novo.',st.code)}st.estado=r;aplicar(r)}catch(x){if(x.rede)semRede(true)}}
const off=()=>{const s=st.estado&&st.estado.sala;return s?new Date(s.agora).getTime()-st.recebido:0};
function aplicar(r){st.recebido=Date.now();const s=r.sala,eu=r.eu;st.off=new Date(s.agora).getTime()-Date.now();
  if(eu.expulso){esquecer();paraTudo();return ecra('exp',`${topo()}<div class="fb no"><div class="ic">🚪</div><h1>Saíste do jogo</h1><p class="mut">${MSG.expulso}</p><button class="btn sec" onclick="location.reload()">Voltar ao início</button></div>`)}
  let p=$('#pausa');if(s.estado==='pausa'&&!p){p=document.createElement('div');p.id='pausa';p.className='pausa';p.textContent='⏸ Em pausa';document.body.appendChild(p)}else if(s.estado!=='pausa'&&p)p.remove();
  if(eu.estado&&eu.estado.trocado&&eu.estado.trocado.em!==st.trocadoVisto){st.trocadoVisto=eu.estado.trocado.em;aviso('🔁 '+eu.estado.trocado.por+' trocou de pontos contigo!')}
  if(s.estado==='fim'||eu.terminou)return ecraFim(r);
  if(s.estado==='espera'&&s.tipo==='vivo')return ecraEspera(r);
  if(s.modo==='classico'&&s.tipo==='vivo')return classico(r);
  /* modos ao ritmo do aluno: só atualiza o painel, não interrompe a pergunta */
  if(!st.livre){st.livre=true;proxima()}else hud()}
function aviso(t){const d=document.createElement('div');d.className='lig';d.style.background='#1e3a8a';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function hud(){const r=st.estado;if(!r)return;const s=r.sala,eu=r.eu;const el=$('#hud');if(!el)return;const flo=s.modo==='floresta';
  el.innerHTML=`${AR.svg(eu.avatar,40)}<b>${esc(eu.alcunha)}</b><span class="sp"></span><span class="pill">${flo?'🌲 '+AR.arvores((eu.estado||{}).arv).inteiras:'⭐ '+AR.nf(eu.pontos)}</span><span class="pill">${eu.pos}.º/${eu.total}</span><span class="pill t" id="rel" ${tempoFim()==null?'hidden':''}></span>`;relogio()}
function tempoFim(){const s=st.estado.sala;if(s.tipo==='vivo'&&s.fim_em)return new Date(s.fim_em).getTime()-st.off;const ini=st.ini||(st.estado.eu.estado||{}).ini;const d=+((s.cfg||{}).duracao||0);if(s.tipo==='tpc'&&ini&&d&&s.modo!=='classico')return new Date(ini).getTime()+d*1000-st.off;return null}
function relogio(){clearInterval(tRel);const f=tempoFim();const el=$('#rel');if(f==null||!el)return;const t=()=>{const r=Math.max(0,(f-Date.now())/1000);const e=$('#rel');if(!e)return clearInterval(tRel);e.textContent='⏱ '+Math.floor(r/60)+':'+String(Math.floor(r%60)).padStart(2,'0');e.classList.toggle('pouco',r<=30);if(r<=0){clearInterval(tRel);setTimeout(atualizar,1500)}};t();tRel=setInterval(t,500)}

function ecraEspera(r){const eu=r.eu;if(ecraAtual==='espera'){const n=$('#njog');if(n)n.textContent=eu.total;return}
  ecra('espera',`${topo()}<div class="lob"><div class="av">${AR.svg(eu.avatar,150)}</div><h1>Estás dentro, ${esc(eu.alcunha)}!</h1><p class="mut">Olha para o quadro. O jogo começa já a seguir.</p><div class="dots"><span></span><span></span><span></span></div><p class="mut peq" style="margin-top:14px"><span id="njog">${eu.total}</span> jogadores na sala</p>
    <button class="btn sec" id="b-av" style="max-width:280px;margin:18px auto 0">Mudar de Pinha</button></div>`);
  $('#b-av').onclick=()=>ecraAvatares(()=>{ecraAtual='';ecraEspera(st.estado)})}
async function ecraAvatares(volta){let col=null;try{col=await rpc('arena_colecao',{p_id:st.id,p_j:st.j,p_tok:st.tok})}catch(_){}const tem=id=>AR.COMUNS.includes(id)||(col&&col.ativa&&col.pinhas&&col.pinhas[id]>0);
  ecra('av',`${topo()}<div class="card"><h2>Escolhe a tua Pinha</h2>${col&&col.ativa?'':'<p class="mut peq">As Pinhas raras desbloqueiam-se com moedas quando o professor usa a lista da turma.</p>'}<div class="avs">${AR.PINHAS.map(p=>`<button type="button" data-av="${p.id}" ${tem(p.id)?'':'disabled'} class="${st.estado.eu.avatar===p.id?'on':''}" title="${esc(p.nome)}">${AR.svg(p.id,56)}${p.rar!=='c'?`<small style="color:${AR.RAR[p.rar][1]}">${AR.RAR[p.rar][0][0]}</small>`:''}</button>`).join('')}</div><button class="btn sec" id="b-v">Voltar</button></div>`);
  document.querySelectorAll('[data-av]:not([disabled])').forEach(b=>b.onclick=async()=>{try{await rpc('arena_avatar',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_avatar:b.dataset.av});st.estado.eu.avatar=b.dataset.av;AR.tocar('entra')}catch(_){}volta()});$('#b-v').onclick=volta}

/* ---------- Clássico ao vivo ---------- */
function classico(r){const s=r.sala,eu=r.eu,p=s.pergunta;if(!p)return ecraEspera(r);const chave='c'+s.atual+(s.revelada?'r':'')+(eu.resp?'x':'');
  if(s.revelada){if(ecraAtual===chave)return;const minha=eu.resp;const ok=minha&&minha.certa;if(ok){AR.tocar('certo');AR.vibrar([30,40,30])}else{AR.tocar('errado');AR.vibrar(200)}
    return ecra(chave,`${topo()}<div class="fb ${ok?'ok':'no'}"><div class="ic">${ok?'✅':minha?'❌':'⌛'}</div><h1>${ok?'Certo!':minha?'Não foi desta':'Não respondeste'}</h1>${ok?`<div class="pts">+${AR.nf(minha.pts)}</div>`:`<p class="mut">A certa era: <b>${esc((p.o||[])[s.certa]||'')}</b></p>`}<p style="margin-top:14px">Estás em <b>${eu.pos}.º lugar</b> de ${eu.total} · ${AR.nf(eu.pontos)} pontos</p>${top5(r)}</div>`)}
  if(eu.resp){if(ecraAtual===chave)return;return ecra(chave,`${topo()}<div class="fb"><div class="ic">🌰</div><h1>Resposta enviada!</h1><p class="mut">Espera pelos outros…</p><div class="dots"><span></span><span></span><span></span></div></div>`)}
  if(ecraAtual===chave)return;st.respAt=null;
  const t=+p.s||20;const ini=new Date(s.atual_ini).getTime()-st.off;
  ecra(chave,`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="row"><span class="mut peq">Pergunta ${s.atual+1} de ${s.n_perg}</span><span class="sp" style="flex:1"></span><b id="cnt"></b></div><div class="bar"><i id="br"></i></div><div class="qt">${esc(p.t)}</div>${p.img?`<img class="qi" src="${p.img}" alt="">`:''}<div class="ops">${(p.o||[]).map((o,k)=>`<button type="button" class="op" style="--oc:${CORES[k]}" data-o="${k}"><span>${FORMAS[k]}</span>${esc(o)}</button>`).join('')}</div></div>`);hud();
  const tick=()=>{const rr=Math.max(0,t-(Date.now()-ini)/1000);const c=$('#cnt'),b=$('#br');if(!c)return clearInterval(st.tq);c.textContent=Math.ceil(rr)+' s';b.style.width=(100*rr/t)+'%';if(rr<=0){clearInterval(st.tq);document.querySelectorAll('.op').forEach(x=>x.disabled=true)}};clearInterval(st.tq);tick();st.tq=setInterval(tick,200);
  document.querySelectorAll('.op').forEach(b=>b.onclick=async()=>{if(ocupado)return;ocupado=true;const k=+b.dataset.o;document.querySelectorAll('.op').forEach(x=>{x.classList.toggle('esc',x===b);x.classList.toggle('sombra',x!==b)});AR.vibrar(20);
    try{const x=await rpc('arena_responder',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_perg:s.atual,p_opc:k});if(x&&x.erro&&x.erro!=='repetida'&&x.erro!=='depressa'){aviso(x.erro==='tempo'||x.erro==='fora'?'O tempo acabou.':'Não foi possível enviar.')}
      st.estado.eu.resp={opc:k};clearInterval(st.tq);ecraAtual='';classico(st.estado)}catch(_){aviso('Sem ligação — tenta outra vez');document.querySelectorAll('.op').forEach(x=>x.classList.remove('esc','sombra'))}ocupado=false})}
function top5(r){return `<div class="top5">${(r.top||[]).map((x,k)=>`<div class="${x.id===st.j?'eu':''}"><b>${k+1}</b>${AR.svg(x.avatar,30)}<span>${esc(x.alcunha)}</span><em>${r.sala.modo==='floresta'?AR.arvores(x.arv).inteiras+' 🌲':AR.nf(x.pontos)}</em></div>`).join('')}</div>`}

/* ---------- modos ao ritmo de cada aluno (Colheita, Floresta, trabalho de casa) ---------- */
async function proxima(){if(ocupado)return;ocupado=true;let q;try{q=await rpc('arena_pergunta',{p_id:st.id,p_j:st.j,p_tok:st.tok});semRede(false)}catch(x){ocupado=false;semRede(true);setTimeout(proxima,2500);return}ocupado=false;
  if(q.erro){if(q.erro==='terminou'||q.erro==='fim'||q.erro==='limite'){st.livre=false;return atualizar()}if(q.erro==='espera'||q.erro==='pausa'){st.livre=false;return setTimeout(atualizar,1500)}if(q.erro==='jogador'){esquecer();return ecraCodigo('A tua ligação a esta sala terminou. Entra de novo.',st.code)}return setTimeout(proxima,2000)}
  if(q.escolha)return colheitaEscolha();if(q.ini)st.ini=q.ini;
  const p=q.pergunta,s=st.estado.sala;st.qAtual=q;
  ecra('q'+q.i+'-'+q.n,`${topo()}<div class="q"><div class="hud" id="hud"></div>${s.modo==='classico'?`<div class="mut peq">Pergunta ${q.n} de ${s.n_perg}</div>`:''}<div class="qt">${esc(p.t)}</div>${p.img?`<img class="qi" src="${p.img}" alt="">`:''}<div class="ops">${(p.o||[]).map((o,k)=>`<button type="button" class="op" style="--oc:${CORES[k]}" data-o="${k}"><span>${FORMAS[k]}</span>${esc(o)}</button>`).join('')}</div></div>`);hud();
  document.querySelectorAll('.op').forEach(b=>b.onclick=()=>responder(q,+b.dataset.o,b))}
async function responder(q,k,b){if(ocupado)return;ocupado=true;document.querySelectorAll('.op').forEach(x=>{x.classList.toggle('esc',x===b);x.classList.toggle('sombra',x!==b)});let x;
  try{x=await rpc('arena_responder',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_perg:q.i,p_opc:k})}catch(_){ocupado=false;aviso('Sem ligação — tenta outra vez');document.querySelectorAll('.op').forEach(z=>z.classList.remove('esc','sombra'));return}ocupado=false;
  if(x.erro){if(x.erro==='depressa')return;if(x.erro==='fora')return proxima();st.livre=false;return atualizar()}
  const s=st.estado.sala;Object.assign(st.estado.eu,{pontos:x.pontos,moedas:x.moedas});if(x.arv!=null){st.estado.eu.estado=st.estado.eu.estado||{};st.estado.eu.estado.arv=x.arv}
  document.querySelectorAll('.op').forEach(z=>{const o=+z.dataset.o;z.classList.remove('esc','sombra');if(o===x.ci)z.classList.add('certa');else z.classList.add('sombra')});
  if(x.certa){AR.tocar('certo');AR.vibrar([30,40,30])}else{AR.tocar('errado');AR.vibrar(200)}
  await new Promise(r=>setTimeout(r,x.certa?650:1300));
  if(s.modo==='colheita'&&x.escolha)return colheitaEscolha();
  if(s.modo==='floresta'){ecra('fb',`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="fb ${x.certa?'ok':'no'}" style="padding:4px 0"><h1>${x.certa?(x.pts>10?'Rebento extra! 🌱':'A árvore cresceu!'):'Ups! A árvore não cresceu'}</h1><div class="flo">${AR.arvore(x.arv,260)}</div><p class="mut">${AR.arvores(x.arv).inteiras} ${AR.arvores(x.arv).inteiras===1?'árvore':'árvores'}${x.seq>=2&&x.certa?' · '+x.seq+' certas seguidas':''}</p></div></div>`);hud();if(x.certa)AR.tocar('cresce');await new Promise(r=>setTimeout(r,x.certa?1300:900))}
  else if(s.modo==='colheita'&&!x.certa){ecra('fb',`${topo()}<div class="fb no"><div class="ic">❌</div><h1>Errado</h1><p class="mut">Sem pinha desta vez. A certa era: <b>${esc((q.pergunta.o||[])[x.ci]||'')}</b></p></div>`);await new Promise(r=>setTimeout(r,1200))}
  else if(s.modo==='classico'){ecra('fb',`${topo()}<div class="fb ${x.certa?'ok':'no'}"><div class="ic">${x.certa?'✅':'❌'}</div><h1>${x.certa?'Certo!':'Errado'}</h1>${x.certa?`<div class="pts">+${AR.nf(x.pts)}</div>`:`<p class="mut">A certa era: <b>${esc((q.pergunta.o||[])[x.ci]||'')}</b></p>`}</div>`);await new Promise(r=>setTimeout(r,1100))}
  if(x.fim){st.livre=false;return atualizar()}proxima()}
function colheitaEscolha(){const cores=['#a0632f','#8b5a2b','#b7793b'];
  ecra('colheita',`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="centro"><h1>Escolhe uma pinha!</h1><p class="mut">Pode ter pontos, duplicar… ou uma surpresa menos boa.</p></div><div class="pinhas3">${[0,1,2].map(k=>`<button type="button" data-p="${k}" aria-label="Pinha ${k+1}">${AR.pinhaFechada(96,cores[k])}</button>`).join('')}</div><div id="efe"></div></div>`);hud();AR.tocar('pinha');
  document.querySelectorAll('.pinhas3 [data-p]').forEach(b=>b.onclick=async()=>{if(ocupado)return;ocupado=true;b.classList.add('abre');let x;try{x=await rpc('arena_acao',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_escolha:+b.dataset.p})}catch(_){ocupado=false;b.classList.remove('abre');return aviso('Sem ligação — tenta outra vez')}ocupado=false;
    if(x.erro){return proxima()}const E=AR.EFEITOS[x.efeito]||['?','#fff'];const txt=x.efeito==='ganha'||x.efeito==='mega'?'+'+AR.nf(x.valor):x.efeito==='dobra'?'×2 (+'+AR.nf(x.valor)+')':x.efeito==='perde'?'−'+AR.nf(x.valor):x.efeito==='troca'?'com '+esc(x.com||''):'0';
    const outros=[...x.outros];document.querySelectorAll('.pinhas3 [data-p]').forEach(z=>{const ef=z===b?x.efeito:outros.shift();const e2=AR.EFEITOS[ef]||['',''];z.disabled=true;z.style.opacity=z===b?1:.45;z.insertAdjacentHTML('beforeend',`<div class="res" style="color:${e2[1]}">${esc(e2[0])}</div>`)});
    st.estado.eu.pontos=x.pontos;hud();$('#efe').innerHTML=`<div class="efeito" style="color:${E[1]}">${E[0]}<br>${txt}</div>`;
    if(x.efeito==='perde'||x.efeito==='vazia')AR.tocar('mau');else{AR.tocar('certo');if(x.efeito==='mega'||x.efeito==='dobra')AR.confetes(document.body,40)}AR.vibrar(40);
    setTimeout(proxima,1800)})}

/* ---------- fim + coleção de Pinhas ---------- */
async function ecraFim(r){if(ecraAtual==='fim')return;paraTudo();st.livre=false;const s=r.sala,eu=r.eu;AR.tocar('fim');let col=null;try{col=await rpc('arena_colecao',{p_id:st.id,p_j:st.j,p_tok:st.tok})}catch(_){}
  ecra('fim',`${topo()}<div class="fim"><div style="margin:8px 0">${AR.svg(eu.avatar,120)}</div><div class="pos">${eu.pos}.º</div><p class="mut">de ${eu.total} jogadores</p><h1>${s.estado==='fim'?'Fim do jogo!':'Terminaste!'}</h1>
    <p style="font-size:20px"><b>${s.modo==='floresta'?AR.arvores((eu.estado||{}).arv).inteiras+' árvores 🌲':AR.nf(eu.pontos)+' pontos'}</b> · ${eu.certas} certas · ${eu.erradas} erradas</p>${top5(r)}
    ${col&&col.ativa?`<button class="btn ouro" id="b-col">🪙 ${col.moedas} moedas · Abrir a coleção</button>`:col&&col.moedas_jogo?`<p class="mut peq" style="margin-top:12px">Ganhaste ${col.moedas_jogo} moedas neste jogo.</p>`:''}<button class="btn sec" id="b-sai">Sair</button></div>`);
  if(eu.pos<=3)AR.confetes(document.body,70);const bc=$('#b-col');if(bc)bc.onclick=()=>ecraColecao();$('#b-sai').onclick=()=>{esquecer();location.hash='';location.reload()}}
async function ecraColecao(novo){let c;try{c=await rpc('arena_colecao',{p_id:st.id,p_j:st.j,p_tok:st.tok})}catch(x){return aviso(x.message)}const P=c.pinhas||{};const n=Object.keys(P).length;
  const SAC=[['bosque','Saco do Bosque',20,'#15803d','🌲'],['serra','Saco da Serra',45,'#0369a1','⛰️'],['cume','Saco do Cume',90,'#7c3aed','🏔️']];
  ecra('col',`${topo()}<div class="card"><div class="row"><h2 style="margin:0;flex:1">A tua coleção</h2><b style="font-size:20px">🪙 ${c.moedas}</b></div><p class="mut peq">${n} de ${AR.PINHAS.length} Pinhas · ganha moedas a jogar com a lista da turma</p>
    ${novo?`<div class="novo">${AR.svg(novo.pinha,150)}<div class="nm">${esc(AR.pinha(novo.pinha).nome)}</div><span class="rar" style="background:${AR.RAR[novo.rar][1]}">${AR.RAR[novo.rar][0]}</span></div>`:''}
    <div class="sacos">${SAC.map(([k,nm,pr,cor,ic])=>`<button type="button" data-s="${k}" style="--sc:${cor}" ${c.moedas<pr?'disabled':''}><i>${ic}</i><b>${nm}</b><span>🪙 ${pr}</span></button>`).join('')}</div>
    <div class="avs">${AR.PINHAS.map(p=>`<button type="button" data-av="${p.id}" ${P[p.id]||p.rar==='c'?'':'disabled'} class="${st.estado&&st.estado.eu.avatar===p.id?'on':''}" title="${esc(p.nome)} · ${AR.RAR[p.rar][0]}">${AR.svg(p.id,56)}${P[p.id]?`<small>×${P[p.id]}</small>`:''}</button>`).join('')}</div><p class="mut peq">Toca numa Pinha que tenhas para a usares como avatar.</p><button class="btn sec" id="b-v">Voltar</button></div>`);
  if(novo){AR.tocar('fim');AR.confetes(document.body,novo.rar==='l'||novo.rar==='m'?120:50)}
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{if(ocupado)return;ocupado=true;b.disabled=true;try{const x=await rpc('arena_saco',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_saco:b.dataset.s});ocupado=false;if(x.erro)return aviso(x.erro==='moedas'?'Não tens moedas suficientes.':'Não foi possível abrir.');AR.tocar('pinha');ecraColecao(x)}catch(e){ocupado=false;aviso(e.message)}});
  document.querySelectorAll('.avs [data-av]:not([disabled])').forEach(b=>b.onclick=async()=>{try{await rpc('arena_avatar',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_avatar:b.dataset.av});if(st.estado)st.estado.eu.avatar=b.dataset.av;aviso('Nova Pinha escolhida!');ecraColecao()}catch(_){}});
  $('#b-v').onclick=()=>{ecraAtual='';ecraFim(st.estado)}}

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&st.j){atualizar();if(st.livre&&!ocupado&&ecraAtual.startsWith('q')===false&&ecraAtual!=='colheita'&&ecraAtual!=='fb')proxima()}});
addEventListener('online',()=>{semRede(false);if(st.j)atualizar()});
const h=AR.limpaCod(decodeURIComponent(location.hash.slice(1)));ecraCodigo('',h);if(h.length===6)abrir(h);
})();
