async function abrir(code){const e=$('#e'),b=$('#b-ok');if(code.length!==6){if(e)e.textContent='O código tem 6 carateres.';return}if(b){b.disabled=true;b.textContent='A procurar…'}
  try{st.code=code;st.id=await AR.salaId(code);history.replaceState(null,'','#'+code);
    const g=lerG(st.id);if(g&&g.j&&g.tok){Object.assign(st,g);const r=await rpc('arena_estado',{p_id:st.id,p_j:st.j,p_tok:st.tok});if(r&&!r.erro&&!r.eu.expulso){st.alcunha=r.eu.alcunha;comecar(r);return}esquecer()}
    const info=await rpc('arena_info',{p_id:st.id});if(!info){if(b){b.disabled=false;b.textContent='Entrar'}if(e)e.textContent=MSG.sala;return}st.info=info;tema(info.cfg&&info.cfg.tema);ecraNome()}
  catch(x){if(b){b.disabled=false;b.textContent='Entrar'}if(e)e.textContent=x.message}}

/* ---------- 2. nome / alcunha + avatar ---------- */
async function ecraNome(){const I=st.info;const lista=I.cfg&&I.cfg.nomes==='lista';const aleat=!lista&&I.cfg&&I.cfg.alcunhas==='aleat';const sorteia=()=>AR.SUGESTOES[Math.floor(Math.random()*AR.SUGESTOES.length)]+' '+(10+Math.floor(Math.random()*90));st.avatar=st.avatar||(AR.CUBOS||AR.COMUNS)[Math.floor(Math.random()*(AR.CUBOS||AR.COMUNS).length)];
  let L=[];if(lista){try{L=await AR.decifrar(I.cfg.lista_c,st.code)}catch(_){return ecraCodigo('Não foi possível abrir a lista da turma. Confirma o código.',st.code)}}
  ecra('nome',`${topo()}<div class="card"><p class="mut" style="margin:0">${esc(I.cfg.titulo||'Jogo')} · ${esc((AR.MODOS[I.modo]||{}).nome||'')}${I.tipo==='tpc'?' · trabalho de casa':''}</p><h1>${lista?'Quem és?':aleat?'A tua alcunha':'Escolhe uma alcunha'}</h1>
    ${lista?`<div class="lista" id="lst">${L.map((x,k)=>`<button type="button" data-k="${k}">${esc(x.n)}</button>`).join('')}</div>`:`<div class="row"><input id="alc" maxlength="24" autocomplete="off" placeholder="A tua alcunha" aria-label="Alcunha" ${aleat?'readonly':''}><button class="ib" id="b-dado" type="button" aria-label="Sugerir alcunha" style="flex:none;width:54px;height:54px;font-size:24px">🎲</button></div><p class="mut peq" style="margin:6px 0 0">${aleat?'Neste jogo as alcunhas são sorteadas. Toca no dado para trocar.':'Não uses o teu nome verdadeiro se não quiseres. Palavras impróprias são recusadas.'}</p>`}
    <label>A tua personagem</label><div class="avs" id="avs">${AR.COMUNS.map(id=>`<button type="button" data-av="${id}" class="${st.avatar===id?'on':''}" aria-label="${esc(AR.pinha(id).nome)}">${AR.svg(id,56)}</button>`).join('')}</div>
    <button class="btn" id="b-ent">Entrar no jogo</button><p class="err" id="e"></p></div>`);
  let esc_=null;if(lista)document.querySelectorAll('#lst [data-k]').forEach(b=>b.onclick=()=>{esc_=L[+b.dataset.k];document.querySelectorAll('#lst [data-k]').forEach(z=>z.classList.toggle('on',z===b))});
  else{const a=$('#alc');a.value=st.alcunha||(aleat?sorteia():'');$('#b-dado').onclick=()=>{a.value=sorteia()};a.onkeydown=e=>{if(e.key==='Enter')$('#b-ent').click()}}
  document.querySelectorAll('#avs [data-av]').forEach(b=>b.onclick=()=>{st.avatar=b.dataset.av;document.querySelectorAll('#avs [data-av]').forEach(z=>z.classList.toggle('on',z===b))});
  $('#b-ent').onclick=async()=>{const e=$('#e'),b=$('#b-ent');let alc,ref=null;if(lista){if(!esc_){e.textContent=MSG.lista;return}{const w=esc_.n.replace(/^\d+\.\s*/,'').split(/\s+/);alc=w[0]+(w.length>1?' '+w[w.length-1][0]+'.':'')}ref=esc_.r}else{alc=$('#alc').value.trim().replace(/\s+/g,' ');const m=AR.alcunhaOk(alc);if(m){e.textContent=m;return}}
    b.disabled=true;b.textContent='A entrar…';st.tok=st.tok||AR.token();
    try{const r=await rpc('arena_entrar',{p_id:st.id,p_alcunha:alc,p_tok:st.tok,p_ref:ref,p_avatar:st.avatar});if(!r||r.erro){b.disabled=false;b.textContent='Entrar no jogo';e.textContent=MSG[r&&r.erro]||'Não foi possível entrar.';return}
      st.j=r.j;st.alcunha=r.alcunha;st.ref=ref;guardar();AR.tocar('entra');AR.vibrar(30);const s=await rpc('arena_estado',{p_id:st.id,p_j:st.j,p_tok:st.tok});comecar(s)}
    catch(x){b.disabled=false;b.textContent='Entrar no jogo';e.textContent=x.message}}}

/* ---------- 3. ciclo do jogo ---------- */
function paraTudo(){clearTimeout(tPoll);clearInterval(tRel);clearTimeout(st.tEsp);clearInterval(st.tq);tPoll=tRel=null;try{canal&&canal.unsubscribe()}catch(_){}canal=null}
async function ligarCanal(){try{const c=await cfg();const m=await import('./esm/supabase-2.117.3.min.js');const sb=m.createClient(c.url,c.anonKey,{auth:{persistSession:false,autoRefreshToken:false}});canal=sb.channel('arena-'+st.id,{config:{broadcast:{self:false}}});
  canal.on('broadcast',{event:'s'},()=>{clearTimeout(st.tAviso);st.tAviso=setTimeout(atualizar,120+Math.random()*450)}).subscribe()}catch(_){}}
function comecar(r){paraTudo();st.estado=r;st.livre=false;st.qAtual=null;{const u=((r.eu||{}).estado||{}).ult;st.ultVisto=u&&u.em}ligarCanal();aplicar(r);agendar()}
function agendar(){clearTimeout(tPoll);const s=st.estado&&st.estado.sala;const vivo=s&&s.tipo==='vivo';const ms=!s?4000:s.estado==='fim'?20000:s.estado==='espera'?3000:(vivo&&s.modo==='classico')?2500:6000;tPoll=setTimeout(async()=>{await atualizar();agendar()},ms)}
async function atualizar(){if(!st.j)return;try{const r=await rpc('arena_estado',{p_id:st.id,p_j:st.j,p_tok:st.tok});semRede(false);if(r.erro==='jogador'){esquecer();return ecraCodigo('A tua ligação a esta sala terminou. Entra de novo.',st.code)}st.estado=r;aplicar(r)}catch(x){if(x.rede)semRede(true)}}
const off=()=>{const s=st.estado&&st.estado.sala;return s?new Date(s.agora).getTime()-st.recebido:0};
function aplicar(r){st.recebido=Date.now();const s=r.sala,eu=r.eu;st.off=new Date(s.agora).getTime()-Date.now();tema(s.cfg&&s.cfg.tema);
  if(s.cfg&&s.cfg.silencio&&!st.somDef){st.somDef=1;let p=null;try{p=localStorage.getItem('arena.som')}catch(_){}if(p==null)AR.som=false}
  if((AR.MODOS[s.modo]||{}).eq&&Date.now()-(st.eqsT||0)>2500){st.eqsT=Date.now();eqsAtual()}
  if(eu.expulso){esquecer();paraTudo();return ecra('exp',`${topo()}<div class="fb no"><div class="ic">🚪</div><h1>Saíste do jogo</h1><p class="mut">${MSG.expulso}</p><button class="btn sec" data-recarregar>Voltar ao início</button></div>`)}
  let p=$('#pausa');if(s.estado==='pausa'&&!p){p=document.createElement('div');p.id='pausa';p.className='pausa';p.textContent='⏸ Em pausa';document.body.appendChild(p)}else if(s.estado!=='pausa'&&p)p.remove();
  if(eu.estado&&eu.estado.trocado&&eu.estado.trocado.em!==st.trocadoVisto){st.trocadoVisto=eu.estado.trocado.em;aviso('🔁 '+eu.estado.trocado.por+' trocou de pontos contigo!')}
  if(eu.estado&&eu.estado.atingido&&eu.estado.atingido.em!==st.atingidoVisto){const a=eu.estado.atingido;if(st.atingidoVisto!==undefined||Date.now()-new Date(a.em).getTime()<15000)aviso(a.como==='escudo'?'🛡️ O teu escudo travou o laser de '+a.por+'!':(a.como==='pirata'?'🏴‍☠️ ':a.como==='meteoro'?'☄️ ':'🎯 ')+a.por+' tirou-te '+AR.nf(a.v)+' pontos!');st.atingidoVisto=a.em}
  if(s.estado==='fim'||eu.terminou)return ecraFim(r);
  if(s.estado==='espera'&&s.tipo==='vivo')return ecraEspera(r);
  if(s.modo==='classico'&&s.tipo==='vivo')return classico(r);
  /* modos ao ritmo do aluno: só atualiza o painel, não interrompe a pergunta */
  if(!st.livre){st.livre=true;proxima()}else hud()}
function aviso(t){const d=document.createElement('div');d.className='lig';d.style.background='#1e3a8a';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function hud(){const r=st.estado;if(!r)return;const s=r.sala,eu=r.eu;const el=$('#hud');if(!el)return;const m=s.modo,e=eu.estado||{};
  const met=m==='floresta'?'🌲 '+AR.arvores(e.arv).inteiras:AR.metrica(m,eu.pontos)+(['cume','expedicao','pesca','corrida'].includes(m)?'':' pts');
  const extra=(m==='colmeia'?`<span class="pill">🍯 ${AR.nf(e.mel||0)}</span>`:'')+(m==='laser'&&e.escudo?'<span class="pill">🛡️</span>':'')+(m==='mare'?`<span class="pill">🌊 ${e.agua||0}/5</span>`:'')+(m==='cofre'?`<span class="pill">🎒 ${AR.nf(e.mao||0)}</span>`:'')+(+e.seq>1?`<span class="pill">${e.seq} seguidas</span>`:'');
  el.innerHTML=`${AR.svg(eu.avatar,36)}<b>${esc(eu.alcunha)}</b>${extra}<span class="pill">${eu.pos}.º/${eu.total}</span><span class="pill t" id="rel" ${tempoFim()==null?'hidden':''}></span><span class="pill pts">${met}</span>`;relogio()}
function tempoFim(){const s=st.estado.sala;if(s.tipo==='vivo'&&s.fim_em)return new Date(s.fim_em).getTime()-st.off;const ini=st.ini||(st.estado.eu.estado||{}).ini;const d=+((s.cfg||{}).duracao||0);if(s.tipo==='tpc'&&ini&&d&&s.modo!=='classico')return new Date(ini).getTime()+d*1000-st.off;return null}
function relogio(){clearInterval(tRel);const f=tempoFim();const el=$('#rel');if(f==null||!el)return;const t=()=>{const r=Math.max(0,(f-Date.now())/1000);const e=$('#rel');if(!e)return clearInterval(tRel);e.textContent='⏱ '+Math.floor(r/60)+':'+String(Math.floor(r%60)).padStart(2,'0');e.classList.toggle('pouco',r<=30);if(r<=0){clearInterval(tRel);setTimeout(atualizar,1500)}};t();tRel=setInterval(t,500)}

function ecraEspera(r){const eu=r.eu;if(ecraAtual==='espera'){const n=$('#njog');if(n)n.textContent=eu.total;return}const M=AR.MODOS[r.sala.modo]||{};
  ecra('espera',`${topo()}<div class="lob"><div class="eyebrow mut">Estás dentro!</div><div class="herobox"><div class="eyebrow">Código da sala</div><div class="big disp">${esc(AR.fmt(st.code))}</div></div><div class="av">${AR.svg(eu.avatar,120)}</div><h1>${esc(eu.alcunha)}</h1><p class="mut" style="margin:0">${M.ic||''} ${esc(M.nome||'')} — ${esc(M.desc||'')}</p><p class="mut" style="margin:0">Olha para o quadro. O jogo começa já a seguir.</p><div class="disp" style="font-size:24px"><span id="njog">${eu.total}</span> na sala</div><div class="dots"><span></span><span></span><span></span></div>
    <button class="btn sec" id="b-av" style="max-width:280px;margin:0 auto">Mudar de Pinha</button></div>`);
  $('#b-av').onclick=()=>ecraAvatares(()=>{ecraAtual='';ecraEspera(st.estado)})}
async function ecraAvatares(volta){let col=null;try{col=await rpc('arena_colecao',{p_id:st.id,p_j:st.j,p_tok:st.tok})}catch(_){}const tem=id=>AR.COMUNS.includes(id)||(col&&col.ativa&&col.pinhas&&col.pinhas[id]>0);
  ecra('av',`${topo()}<div class="card"><h2>Escolhe a tua Pinha</h2>${col&&col.ativa?'':'<p class="mut peq">As Pinhas raras desbloqueiam-se com moedas quando o professor usa a lista da turma.</p>'}<div class="avs">${AR.PINHAS.map(p=>`<button type="button" data-av="${p.id}" ${tem(p.id)?'':'disabled'} class="${st.estado.eu.avatar===p.id?'on':''}" title="${esc(p.nome)}">${AR.svg(p.id,56)}${p.rar!=='c'?`<small style="color:${AR.RAR[p.rar][1]}">${AR.RAR[p.rar][0][0]}</small>`:''}</button>`).join('')}</div><button class="btn sec" id="b-v">Voltar</button></div>`);
  document.querySelectorAll('[data-av]:not([disabled])').forEach(b=>b.onclick=async()=>{try{await rpc('arena_avatar',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_avatar:b.dataset.av});st.estado.eu.avatar=b.dataset.av;AR.tocar('entra')}catch(_){}volta()});$('#b-v').onclick=volta}

/* ---------- Clássico ao vivo ---------- */
function classico(r){const s=r.sala,eu=r.eu,p=s.pergunta;if(!p)return ecraEspera(r);const chave='c'+s.atual+(s.revelada?'r':'')+(eu.resp?'x':'');
  if(s.revelada){if(ecraAtual===chave)return;const minha=eu.resp;const ok=minha&&minha.certa;if(ok){AR.tocar('certo');AR.vibrar([30,40,30])}else{AR.tocar('errado');AR.vibrar(200)}
    return ecra(chave,`${topo()}<div class="fb ${ok?'ok':'no'}"><div class="ic">${ok?'✅':minha?'❌':'⌛'}</div><h1>${ok?'Certo!':minha?'Não foi desta':'Não respondeste'}</h1>${ok?`<div class="pts">+${AR.nf(minha.pts)}</div>`:`<p class="mut">A certa era: <b>${esc((p.o||[])[s.certa]||'')}</b></p>`}<p style="margin-top:14px">Estás em <b>${eu.pos}.º lugar</b> de ${eu.total} · ${AR.nf(eu.pontos)} pontos</p>${top5(r)}</div>`)}
  if(eu.resp){if(ecraAtual===chave)return;return ecra(chave,`${topo()}<div class="fb"><div class="ic">🌰</div><h1>Resposta enviada!</h1><p class="mut">Espera pelos outros…</p><div class="dots"><span></span><span></span><span></span></div></div>`)}
  if(ecraAtual===chave)return;st.respAt=null;
  const t=+p.s||20;const ini=new Date(s.atual_ini).getTime()-st.off;
  ecra(chave,`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="qtop"><span>Pergunta ${s.atual+1}/${s.n_perg}</span><span class="mut">${esc((AR.MODOS[s.modo]||{}).nome||'')}</span><span class="sp" style="flex:1"></span><b id="cnt"></b></div><div class="bar"><i id="br"></i></div><div class="qt">${esc(p.t)}</div>${p.img?`<img class="qi" src="${esc(p.img)}" alt="">`:''}<div class="ops">${(p.o||[]).map((o,k)=>`<button type="button" class="op" style="--oc:${CORES[k]}" data-o="${k}"><span>${FORMAS[k]}</span>${esc(o)}</button>`).join('')}</div></div>`);hud();
  const tick=()=>{const rr=Math.max(0,t-(Date.now()-ini)/1000);const c=$('#cnt'),b=$('#br');if(!c)return clearInterval(st.tq);c.textContent=Math.ceil(rr)+' s';b.style.width=(100*rr/t)+'%';b.classList.toggle('pouco',rr<=3);if(rr<=0){clearInterval(st.tq);document.querySelectorAll('.op').forEach(x=>x.disabled=true)}};clearInterval(st.tq);tick();st.tq=setInterval(tick,200);
  document.querySelectorAll('.op').forEach(b=>b.onclick=async()=>{if(ocupado)return;ocupado=true;const k=+b.dataset.o;document.querySelectorAll('.op').forEach(x=>{x.classList.toggle('esc',x===b);x.classList.toggle('sombra',x!==b)});AR.vibrar(20);
    try{const x=await rpc('arena_responder',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_perg:s.atual,p_opc:k});if(x&&x.erro&&x.erro!=='repetida'&&x.erro!=='depressa'){aviso(x.erro==='tempo'||x.erro==='fora'?'O tempo acabou.':'Não foi possível enviar.')}
      st.estado.eu.resp={opc:k};clearInterval(st.tq);ecraAtual='';classico(st.estado)}catch(_){aviso('Sem ligação — tenta outra vez');document.querySelectorAll('.op').forEach(x=>x.classList.remove('esc','sombra'))}ocupado=false})}
function top5(r){return `<div class="top5">${(r.top||[]).map((x,k)=>`<div class="${x.id===st.j?'eu':''}"><b>${k+1}</b>${AR.svg(x.avatar,30)}<span>${esc(x.alcunha)}</span><em>${AR.metrica(r.sala.modo,x.pontos,x.arv)}</em></div>`).join('')}</div>`}

/* ---------- modos ao ritmo de cada aluno (Colheita, Floresta, trabalho de casa) ---------- */
async function proxima(){if(ocupado)return;clearTimeout(st.tEsp);clearInterval(st.tq);ocupado=true;let q;const novo=AR.NOVOS.includes(st.estado.sala.modo);try{q=await rpc(novo?'arena_pergunta2':'arena_pergunta',{p_id:st.id,p_j:st.j,p_tok:st.tok});semRede(false)}catch(x){ocupado=false;semRede(true);setTimeout(proxima,2500);return}ocupado=false;
  if(q.erro){if(q.erro==='terminou'||q.erro==='fim'||q.erro==='limite'){st.livre=false;return atualizar()}if(q.erro==='espera'||q.erro==='pausa'){st.livre=false;return setTimeout(atualizar,1500)}if(q.erro==='jogador'){esquecer();return ecraCodigo('A tua ligação a esta sala terminou. Entra de novo.',st.code)}return setTimeout(proxima,2000)}
  if(q.escolha)return escolher();if(q.vez===false)return ecraVez(q);if(q.duelo_espera)return ecraDueloEspera(q);if(q.ini)st.ini=q.ini;
  const p=q.pergunta,s=st.estado.sala;st.qAtual=q;if(novo&&(AR.MODOS[s.modo]||{}).eq)await eqsAtual();
  ecra('q'+q.i+'-'+q.n,`${topo()}<div class="q"><div class="hud" id="hud"></div>${novo?painel(q):''}${s.modo==='classico'?`<div class="qtop"><span>Pergunta ${q.n}/${s.n_perg}</span><span class="mut">${esc((AR.MODOS[s.modo]||{}).nome||'')}</span></div>`:''}${s.modo==='cume'?'<div class="bar"><i id="br"></i></div>':''}<div class="qt">${esc(p.t)}${novo?'<span class="fbl" id="fbl" aria-live="assertive"></span>':''}</div>${p.img?`<img class="qi" src="${esc(p.img)}" alt="">`:''}<div class="ops">${(p.o||[]).map((o,k)=>`<button type="button" class="op" style="--oc:${CORES[k]}" data-o="${k}"><span>${FORMAS[k]}</span>${esc(o)}</button>`).join('')}</div></div>`);hud();
  document.querySelectorAll('.op').forEach(b=>b.onclick=()=>responder(q,+b.dataset.o,b));if(s.modo==='cume')barra(+p.s||20)}
function barra(t){const ini=Date.now();clearInterval(st.tq);const f=()=>{const b=$('#br');if(!b)return clearInterval(st.tq);const r=Math.max(0,t-(Date.now()-ini)/1000);b.style.width=(100*r/t)+'%';b.classList.toggle('pouco',r<=3);if(r<=0)clearInterval(st.tq)};f();st.tq=setInterval(f,200)}
async function responder(q,k,b){if(ocupado)return;ocupado=true;document.querySelectorAll('.op').forEach(x=>{x.classList.toggle('esc',x===b);x.classList.toggle('sombra',x!==b)});let x;
  const novo=AR.NOVOS.includes(st.estado.sala.modo);clearInterval(st.tq);
  try{x=await rpc(novo?'arena_responder2':'arena_responder',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_perg:q.i,p_opc:k})}catch(_){ocupado=false;aviso('Sem ligação — tenta outra vez');document.querySelectorAll('.op').forEach(z=>z.classList.remove('esc','sombra'));return}ocupado=false;
  if(x.erro){if(x.erro==='depressa')return;if(x.erro==='fora')return proxima();st.livre=false;return atualizar()}
  const s=st.estado.sala;Object.assign(st.estado.eu,{pontos:x.pontos,moedas:x.moedas});if(x.arv!=null){st.estado.eu.estado=st.estado.eu.estado||{};st.estado.eu.estado.arv=x.arv}
  document.querySelectorAll('.op').forEach(z=>{const o=+z.dataset.o;z.classList.remove('esc','sombra');if(x.ci!=null){if(o===x.ci)z.classList.add('certa');else z.classList.add(z===b?'meia':'sombra')}else if(z!==b)z.classList.add('sombra');else if(x.certa)z.classList.add('certa');else z.classList.add('meia')});
  if(x.certa){AR.tocar('certo');AR.vibrar([30,40,30])}else{AR.tocar('errado');AR.vibrar(200)}
  if(novo)return fbNovo(x,q);
  await new Promise(r=>setTimeout(r,x.certa?650:1300));
  if(x.escolha&&AR.ESCOLHA.includes(s.modo))return escolher(x);
  if(s.modo==='pesca'){pescaFb(x,q);await new Promise(r=>setTimeout(r,x.certa?1500:1200))}
  else if(s.modo==='corrida'){corridaFb(x,q);await new Promise(r=>setTimeout(r,x.certa?1300:1100))}
  else if(s.modo==='floresta'){ecra('fb',`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="fb ${x.certa?'ok':'no'}" style="padding:4px 0"><h1>${x.certa?(x.pts>10?'Rebento extra! 🌱':'A árvore cresceu!'):'Ups! A árvore não cresceu'}</h1><div class="flo">${AR.arvore(x.arv,260)}</div><p class="mut">${AR.arvores(x.arv).inteiras} ${AR.arvores(x.arv).inteiras===1?'árvore':'árvores'}${x.seq>=2&&x.certa?' · '+x.seq+' certas seguidas':''}</p></div></div>`);hud();if(x.certa)AR.tocar('cresce');await new Promise(r=>setTimeout(r,x.certa?1300:900))}

function sol3(p,ci,k){const tp=p.tp||'mc';k=k||{};if(tp==='mc'||tp==='vf'||!p.tp)return (p.o||[])[ci]||'';if(tp==='multi')return (k.c||[]).map(i=>(p.o||[])[i]).join(', ');if(tp==='rc')return (k.a||[]).join(' / ');

function corpo3(p,o){o=o||{};const tp=p.tp||'mc';const mostrar=o.mostrar!==false;const ops=p.o||[];

  if(tp==='rc'||tp==='nuvem')return `<input class="inp3" data-tx maxlength="${p.max||40}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${tp==='nuvem'?'Uma palavra ou expressão':'Escreve a resposta'}"><button type="button" class="btn" data-env disabled>Enviar</button>`;

  if(tp==='slide'){if(ecraAtual===chave)return;return ecra(chave,`${topo()}<div class="q">${p.lay==='imagem'&&p.img?`<img class="qi" src="${esc(p.img)}" alt="">`:`<div class="qt">${esc(p.t||'')}</div>${p.img?`<img class="qi" src="${esc(p.img)}" alt="">`:''}${p.tx?`<p class="sltx3">${esc(p.tx).replace(/\n/g,'<br>')}</p>`:''}`}<p class="mut c3">👀 Acompanha no ecrã</p></div>`)}
  if(s.revelada){if(ecraAtual===chave)return;const minha=eu.resp;const pos=c.aula?'':`<p style="margin-top:14px">Estás em <b>${eu.pos}.º lugar</b> de ${eu.total} · ${AR.nf(eu.pontos)} pontos</p>${top5(r)}`;
    if(!AR.tpGrad(tp))return ecra(chave,`${topo()}<div class="fb"><div class="ic">${minha?'📨':'⌛'}</div><h1>${minha?'Obrigado!':'Não respondeste'}</h1><p class="mut">${tp==='ideias'?'As ideias estão no ecrã.':'Os resultados estão no ecrã.'}</p></div>`);
    const ok=minha&&minha.certa;if(ok){AR.tocar('certo');AR.vibrar([30,40,30])}else{AR.tocar('errado');AR.vibrar(200)}const pts=minha?+minha.pts||0:0;
    return ecra(chave,`${topo()}<div class="fb ${ok?'ok':'no'}"><div class="ic">${ok?'✅':minha?'❌':'⌛'}</div><h1>${ok?'Certo!':minha?'Não foi desta':'Não respondeste'}</h1>${minha&&pts?`<div class="pts">${pts>0?'+':'−'}${AR.nf(Math.abs(pts))}</div>`:''}${ok?'':`<p class="mut">A certa era: <b>${esc(sol3(p,s.certa,s.certa3))}</b></p>`}${pos}</div>`)}
  if(eu.resp){if(ecraAtual===chave)return;return ecra(chave,`${topo()}<div class="fb"><div class="ic">📨</div><h1>Resposta enviada!</h1><p class="mut">Espera pelos outros…</p><div class="dots"><span></span><span></span><span></span></div></div>`)}
  if(ecraAtual===chave)return;
  const t=+p.s||20;const ini=new Date(s.atual_ini).getTime()-st.off;const most=c.mostrar!==false;
  ecra(chave,`${topo()}<div class="q"><div class="hud" id="hud"></div><div class="qtop"><span>Pergunta ${s.atual+1}/${s.n_perg}</span><span class="mut">${esc(T.n)}${p.pm===2?' · pontos a dobrar':''}</span><span class="sp" style="flex:1"></span><b id="cnt"></b></div><div class="bar"><i id="br"></i></div>${most||!AR.tpOps(tp)?`<div class="qt">${esc(p.t)}</div>${p.img&&tp!=='pino'?`<img class="qi" src="${esc(p.img)}" alt="">`:''}`:''}${confHtml(c,tp)}${corpo3(p,{mostrar:most})}</div>`);hud();
  const tick=()=>{const rr=Math.max(0,t-(Date.now()-ini)/1000);const cc=$('#cnt'),b=$('#br');if(!cc)return clearInterval(st.tq);cc.textContent=Math.ceil(rr)+' s';b.style.width=(100*rr/t)+'%';b.classList.toggle('pouco',rr<=3);if(rr<=0){clearInterval(st.tq);document.querySelectorAll('.q button,.q input,.q textarea').forEach(x=>x.disabled=true)}};clearInterval(st.tq);tick();st.tq=setInterval(tick,200);
  ligar3(p,async resp=>{if(ocupado)return;ocupado=true;AR.vibrar(20);try{const x=await rpc('arena_responder3',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_perg:s.atual,p_resp:resp,p_conf:st.conf});if(x&&x.erro&&x.erro!=='repetida'&&x.erro!=='depressa')aviso(x.erro==='tempo'||x.erro==='fora'?'O tempo acabou.':'Não foi possível enviar.');
    st.estado.eu.resp={opc:-9};clearInterval(st.tq);ecraAtual='';ocupado=false;classico(st.estado)}catch(_){ocupado=false;aviso('Sem ligação — tenta outra vez');document.querySelectorAll('[data-env]').forEach(b=>b.disabled=false)}},$('.q'))}
async function votar3(r){const s=r.sala;const chave='vot'+s.atual;let d;try{d=await rpc('arena_ideias',{p_id:st.id,p_j:st.j,p_tok:st.tok})}catch(_){return}if(d.erro)return;
  if(ecraAtual===chave&&st.vot3===JSON.stringify(d))return;st.vot3=JSON.stringify(d);const n=d.i.filter(x=>x.eu).length;
  ecra(chave,`${topo()}<div class="q"><div class="qt">${esc((s.pergunta||{}).t||'Ideias')}</div><p class="mut c3">Vota nas ideias de que mais gostas · ${3-n} voto${3-n===1?'':'s'} por usar</p><div class="vt3">${d.i.map(x=>`<button type="button" data-v="${x.id}:${x.k}" aria-pressed="${x.eu}" ${x.minha?'disabled title="É tua"':''}>${esc(x.t)}${x.minha?' <small>(tua)</small>':''}</button>`).join('')||'<p class="mut">Ainda não há ideias.</p>'}</div></div>`);
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{const [id,k]=b.dataset.v.split(':');b.disabled=true;try{const x=await rpc('arena_ideia_votar',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_resp:+id,p_idx:+k});if(x.erro==='votos')aviso('Já usaste os 3 votos. Tira um para votar noutra.')}catch(_){}st.vot3='';votar3(st.estado)})}
const _cl3=classico;classico=function(r){if(r&&r.sala&&r.sala.cfg&&r.sala.cfg.v3)return classico3(r);return _cl3.apply(this,arguments)};

/* ao ritmo de cada aluno (salas novas): tipos novos e pontuação no servidor novo */
const _rpc3=rpc;rpc=async function(fn,args){if((fn==='arena_responder'||fn==='arena_responder2')&&v3()){const R=st.sp3R;st.sp3R=null;const x=await _rpc3('arena_responder3',{p_id:args.p_id,p_j:args.p_j,p_tok:args.p_tok,p_perg:args.p_perg,p_resp:R?R.resp:args.p_opc,p_conf:st.conf});st.sol3=x&&x.sol?x.sol:null;return x}return _rpc3.apply(this,arguments)};
function q3(){const q=st.qAtual;if(!q||!q.pergunta)return;const p=q.pergunta,tp=p.tp||'mc';const s=st.estado.sala;
  if(!['mc','vf','sond'].includes(tp)&&p.tp){const ops=document.querySelector('.q .ops');if(!ops)return;const w=document.createElement('div');w.className='w3';w.innerHTML=(s.modo==='classico'?confHtml(s.cfg,tp):'')+corpo3(p);ops.replaceWith(w);
    queueMicrotask(()=>ligar3(p,resp=>{st.sp3R={resp};const b=w.querySelector('[data-env]')||w.querySelector('button');responder(q,-1,b||document.createElement('button'))},w))}
  else if(s.modo==='classico'&&s.cfg.confianca&&!document.querySelector('.conf3')){const ops=document.querySelector('.q .ops');if(ops){ops.insertAdjacentHTML('beforebegin',confHtml(s.cfg,tp));ligar3({tp:'_'},()=>{},document.querySelector('.q'))}}
  if(p.oi)document.querySelectorAll('.q .op').forEach(b=>{const k=+b.dataset.o;if(p.oi[k]&&!b.querySelector('img'))b.insertAdjacentHTML('beforeend',`<img class="opi3" src="${esc(p.oi[k])}" alt="">`)})}

/* barra de reações e perguntas do público; marca própria */
function barra3(){const r=st.estado;let b=$('#bar3');const s=r&&r.sala;const c=(s&&s.cfg)||{};const on=s&&s.tipo==='vivo'&&s.estado!=='fim'&&(c.reacoes||c.qa==='livre'||c.qa==='moderada')&&!['codigo','nome','fim','exp'].includes(ecraAtual)&&!ecraAtual.startsWith('est');
  document.body.classList.toggle('com3',!!on);if(!on){if(b)b.remove();return}const html=`${c.reacoes?AR.REACOES.map((e,k)=>`<button type="button" data-rx="${k}" aria-label="Reagir ${e}">${e}</button>`).join(''):''}${c.qa==='livre'||c.qa==='moderada'?`<button type="button" class="qa3b" data-qa><span aria-hidden="true">❓</span><span>Perguntar</span></button>`:''}`;
  if(!b){b=document.createElement('div');b.id='bar3';b.className='bar3';document.body.appendChild(b)}if(b.dataset.h!==html){b.dataset.h=html;b.innerHTML=html;
    b.querySelectorAll('[data-rx]').forEach(x=>x.onclick=async()=>{x.classList.remove('pum');void x.offsetWidth;x.classList.add('pum');AR.vibrar&&AR.vibrar(10);try{await rpc('arena_reagir',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_r:+x.dataset.rx})}catch(_){}});
    const qb=b.querySelector('[data-qa]');if(qb)qb.onclick=()=>qa3()}}
async function qa3(){let o=$('#qa3');if(!o){o=document.createElement('div');o.id='qa3';o.className='qa3';o.setAttribute('role','dialog');o.setAttribute('aria-label','Perguntas ao professor');document.body.appendChild(o)}
  let d={q:[]};try{d=await rpc('arena_qa_lista',{p_id:st.id,p_j:st.j,p_tok:st.tok})}catch(_){}const mod=((st.estado.sala.cfg)||{}).qa==='moderada';
  o.innerHTML=`<div class="qa3c"><div class="row3"><b>Perguntas ao professor</b><span style="flex:1"></span><button type="button" class="ib" data-x aria-label="Fechar">✕</button></div>
    <textarea class="inp3" data-t maxlength="240" rows="2" placeholder="Escreve a tua pergunta"></textarea><label class="mut c3l"><input type="checkbox" data-an> Enviar sem o meu nome</label><button type="button" class="btn" data-e>Enviar</button>${mod?'<p class="mut c3">O professor aprova as perguntas antes de aparecerem.</p>':''}
    <div class="qa3l">${(d.q||[]).map(x=>`<div class="${x.e}"><span>${esc(x.t)}${x.a?`<small> · ${esc(x.a)}</small>`:''}${x.e==='pendente'?'<small> · à espera de aprovação</small>':x.e==='respondida'?'<small> · respondida</small>':''}</span>${x.e==='pendente'||x.minha?`<em>${x.v} ▲</em>`:`<button type="button" data-v="${x.id}" aria-pressed="${x.eu}">▲ ${x.v}</button>`}</div>`).join('')||'<p class="mut">Ainda não há perguntas. Sê o primeiro!</p>'}</div></div>`;
  o.querySelector('[data-x]').onclick=()=>{o.remove();clearTimeout(st.qa3t)};
  o.querySelector('[data-e]').onclick=async e=>{const t=o.querySelector('[data-t]').value.trim();if(t.length<2)return;e.target.disabled=true;try{const x=await rpc('arena_qa_enviar',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_texto:t,p_anonima:o.querySelector('[data-an]').checked});if(x.erro)aviso(x.erro==='depressa'?'Espera um pouco antes de enviar outra.':x.erro==='muitas'?'Já enviaste muitas perguntas.':'Não foi possível enviar.');else aviso(x.moderada?'Enviada! Aparece quando o professor aprovar.':'Pergunta enviada!')}catch(_){aviso('Sem ligação')}qa3()};
  o.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await rpc('arena_qa_votar',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_q:+b.dataset.v})}catch(_){}qa3()});
  clearTimeout(st.qa3t);st.qa3t=setTimeout(()=>{const x=$('#qa3');if(x&&!x.contains(document.activeElement)||x&&document.activeElement===document.body)qa3()},6000)}
function marca3(){const c=(st.estado&&st.estado.sala&&st.estado.sala.cfg)||{};const m=c.marca;document.body.classList.toggle('marca3',!!(m&&(m.cor||m.fundo)));if(m){if(/^#[0-9a-f]{6}$/i.test(m.cor||''))document.body.style.setProperty('--primary',m.cor);if(/^#[0-9a-f]{6}$/i.test(m.fundo||''))document.body.style.setProperty('--hero',m.fundo)}
  const lg=document.querySelector('header.top .logo');if(lg&&m&&(m.logo||m.nome)&&!lg.dataset.m3){lg.dataset.m3=1;lg.innerHTML=`${m.logo?`<img src="${esc(m.logo)}" alt="" class="lg3">`:''}${m.nome?`<span>${esc(m.nome)}</span>`:''}`}}
const _ecra3=ecra;ecra=function(nome,html){const r=_ecra3.apply(this,arguments);try{if(typeof nome==='string'&&nome.startsWith('q')&&v3())q3();const q=st.qAtual;if(nome==='fb'&&q&&q.pergunta&&!AR.tpGrad(q.pergunta.tp)){const f=document.querySelector('.fb');if(f){f.className='fb';f.innerHTML='<div class="ic">📨</div><h1>Resposta registada</h1>'}}else if(nome==='fb'&&st.sol3&&q){const b=document.querySelector('.fb p.mut b');if(b)b.textContent=sol3(q.pergunta,-1,st.sol3)}marca3();barra3()}catch(e){console.warn(e)}return r};

/* Estudo: cartões, aprender, pares e teste (ao ritmo de cada aluno, sem pressa) */
const _apl3=aplicar;aplicar=function(r){try{if(r&&r.sala&&r.sala.cfg&&r.sala.cfg.estudo&&!r.eu.expulso&&r.sala.estado!=='fim'){st.recebido=Date.now();st.off=new Date(r.sala.agora).getTime()-Date.now();tema(r.sala.cfg.tema);if(!ecraAtual.startsWith('est'))estudo3();return}}catch(e){console.warn(e)}return _apl3.apply(this,arguments)};
async function estudo3(){if(!st.E){try{const d=await rpc('arena_estudo',{p_id:st.id,p_j:st.j,p_tok:st.tok});if(d.erro)return ecra('estx',`${topo()}<div class="fb no"><div class="ic">📚</div><h1>${d.erro==='limite'?'O prazo terminou':'Não foi possível abrir'}</h1></div>`);st.E={P:d.perguntas.map((p,i)=>({p,ci:d.certas[i],k:(d.extra||[])[i]||null,i})).filter(x=>AR.tpGrad(x.p.tp)),prog:d.estudo||{}}}catch(e){return aviso('Sem ligação — tenta outra vez')}}
  const E=st.E,pr=E.prog||{};const card=(k,ic,t,sub)=>`<button type="button" class="est3c" data-m="${k}"><span>${ic}</span><b>${t}</b><small>${sub}</small>${pr[k]?`<em>melhor: ${pr[k].melhor}%</em>`:''}</button>`;
  ecra('est',`${topo()}<div class="card est3"><div class="eyebrow mut">Estudo · ${E.P.length} pergunta${E.P.length===1?'':'s'}</div><h1>${esc((st.estado.sala.cfg||{}).titulo||'Estudar')}</h1><p class="mut">Escolhe como queres estudar. O professor vê o teu progresso.</p>
    <div class="est3g">${card('cartoes','🃏','Cartões','Vê a pergunta, vira e confirma a resposta')}${card('aprender','🧠','Aprender','As que falhas voltam até as dominares')}${card('pares','🧩','Pares','Junta cada pergunta à sua resposta')}${card('teste','📝','Teste','Todas de seguida, com nota no fim')}</div></div>`);
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>({cartoes:cartoes3,aprender:aprender3,pares:pares3,teste:teste3})[b.dataset.m]())}
async function reg3(modo,c,t,d){try{const x=await rpc('arena_estudo_registo',{p_id:st.id,p_j:st.j,p_tok:st.tok,p_modo:modo,p_certas:c,p_total:t,p_dominadas:d||0});if(x&&x.estudo&&st.E)st.E.prog=x.estudo}catch(_){}}
const voltar3=()=>`<button type="button" class="btn sec" data-vol>← Escolher outro modo</button>`;const ligVol=()=>{const b=$('[data-vol]');if(b)b.onclick=()=>{ecraAtual='';estudo3()}};
const baralha=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function cartoes3(){const L=baralha(st.E.P);let i=0,virado=false,sabe=0;const des=()=>{if(i>=L.length){reg3('cartoes',sabe,L.length,sabe);return ecra('est-f',`${topo()}<div class="fb ok"><div class="ic">🃏</div><h1>Fim dos cartões</h1><p>Sabias <b>${sabe}</b> de ${L.length}.</p>${voltar3()}</div>`),ligVol()}const x=L[i];
    ecra('est-c'+i+(virado?'v':''),`${topo()}<div class="q"><div class="qtop"><span>Cartão ${i+1}/${L.length}</span></div><button type="button" class="cart3 ${virado?'v':''}" data-vira><span class="f">${esc(x.p.t)}${x.p.img?`<img src="${esc(x.p.img)}" alt="">`:''}</span><span class="b">${esc(sol3(x.p,x.ci,x.k))||'—'}</span></button><p class="mut c3">${virado?'Sabias a resposta?':'Toca no cartão para o virar'}</p>${virado?`<div class="row3 g3"><button type="button" class="btn sec" data-nao>Ainda não</button><button type="button" class="btn" data-sim>Sabia</button></div>`:''}${voltar3()}</div>`);ligVol();
    $('[data-vira]').onclick=()=>{virado=!virado;des()};const s=$('[data-sim]'),n=$('[data-nao]');if(s)s.onclick=()=>{sabe++;i++;virado=false;des()};if(n)n.onclick=()=>{L.push(x);i++;virado=false;if(L.length>st.E.P.length*3)L.length=Math.max(i,L.length);des()}};des()}
function pergunta3(x,titulo,feito){const p=x.p;ecra('est-q'+Math.random(),`${topo()}<div class="q"><div class="qtop"><span>${titulo}</span></div><div class="qt">${esc(p.t)}</div>${p.img&&p.tp!=='pino'?`<img class="qi" src="${esc(p.img)}" alt="">`:''}<div class="w3">${corpo3(p)}</div>${voltar3()}</div>`);ligVol();
  ligar3(p,resp=>{const ok=certo3(p,x.ci,x.k,resp);AR.tocar(ok?'certo':'errado');AR.vibrar&&AR.vibrar(ok?[30,40,30]:150);const w=$('.w3');w.insertAdjacentHTML('afterend',`<div class="fb3 ${ok?'ok':'no'}"><b>${ok?'✅ Certo!':'❌ A certa era: '+esc(sol3(p,x.ci,x.k))}</b><button type="button" class="btn" data-seg>Continuar</button></div>`);w.querySelectorAll('button,input,textarea').forEach(e=>e.disabled=true);$('[data-seg]').onclick=()=>feito(ok);if(ok)setTimeout(()=>{const b=$('[data-seg]');if(b)b.focus()},50)},$('.w3'))}
function aprender3(){const P=st.E.P;const dom=new Map(P.map(x=>[x.i,0]));let fila=baralha(P),cer=0,tent=0;const prox=()=>{const fd=P.filter(x=>dom.get(x.i)>=2).length;if(fd>=P.length){reg3('aprender',cer,tent,fd);return ecra('est-f',`${topo()}<div class="fb ok"><div class="ic">🧠</div><h1>Dominaste tudo!</h1><p>${cer} certas em ${tent} tentativas.</p>${voltar3()}</div>`),ligVol()}
    if(!fila.length)fila=baralha(P.filter(x=>dom.get(x.i)<2));const x=fila.shift();pergunta3(x,`Aprender · ${fd}/${P.length} dominadas`,ok=>{tent++;if(ok){cer++;dom.set(x.i,dom.get(x.i)+1)}else{dom.set(x.i,0);fila.splice(Math.min(2,fila.length),0,x)}if(tent%5===0)reg3('aprender',cer,tent,P.filter(z=>dom.get(z.i)>=2).length);prox()})};prox()}
function teste3(){const L=baralha(st.E.P);let i=0,cer=0;const err=[];const prox=()=>{if(i>=L.length){reg3('teste',cer,L.length,cer);const nota=L.length?Math.round(20*cer/L.length*10)/10:0;return ecra('est-f',`${topo()}<div class="fb ${cer/L.length>=.5?'ok':'no'}"><div class="ic">📝</div><h1>${cer} de ${L.length} certas</h1><p class="pts">${nota.toLocaleString('pt-PT')} valores</p>${err.length?`<div class="rev3"><b>A rever</b>${err.map(x=>`<p>${esc(x.p.t)}<br><small>→ ${esc(sol3(x.p,x.ci,x.k))}</small></p>`).join('')}</div>`:''}${voltar3()}</div>`),ligVol()}
    const x=L[i];pergunta3(x,`Teste · ${i+1}/${L.length}`,ok=>{if(ok)cer++;else err.push(x);i++;prox()})};prox()}
function pares3(){const L=baralha(st.E.P.filter(x=>sol3(x.p,x.ci,x.k)&&x.p.tp!=='pino')).slice(0,6);if(L.length<2)return aviso('São precisas pelo menos 2 perguntas para os pares.');const t0=Date.now();let sel=null,feitos=new Set(),erros=0;
  const C=baralha([...L.map(x=>({k:x.i,t:x.p.t,q:1})),...L.map(x=>({k:x.i,t:sol3(x.p,x.ci,x.k),q:0}))]);
  const des=()=>{if(feitos.size===L.length){const s=Math.round((Date.now()-t0)/1000);reg3('pares',L.length,L.length+erros,L.length);return ecra('est-f',`${topo()}<div class="fb ok"><div class="ic">🧩</div><h1>Todos os pares!</h1><p>${s} segundos · ${erros} engano${erros===1?'':'s'}</p>${voltar3()}</div>`),ligVol()}
    ecra('est-p'+feitos.size+'-'+(sel==null?'':sel)+'-'+erros,`${topo()}<div class="q"><div class="qtop"><span>Pares · ${feitos.size}/${L.length}</span></div><div class="par3">${C.map((c,i)=>`<button type="button" data-c="${i}" class="${c.q?'pq':'pa'} ${feitos.has(c.k)?'ok':''} ${sel===i?'sel':''}" ${feitos.has(c.k)?'disabled':''}>${esc(c.t)}</button>`).join('')}</div>${voltar3()}</div>`);ligVol();
    document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const i=+b.dataset.c;if(sel==null){sel=i;return des()}if(sel===i){sel=null;return des()}const a=C[sel],c=C[i];if(a.k===c.k&&a.q!==c.q){feitos.add(a.k);AR.tocar('certo')}else{erros++;AR.tocar('errado');AR.vibrar&&AR.vibrar(120)}sel=null;des()})};des()}

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&st.j){atualizar();if(st.livre&&!ocupado&&ecraAtual.startsWith('q')===false&&ecraAtual!=='colheita'&&ecraAtual!=='fb')proxima()}});
addEventListener('online',()=>{semRede(false);if(st.j)atualizar()});
document.addEventListener('click',e=>{if(e.target&&e.target.closest&&e.target.closest('[data-recarregar]'))location.reload()});
const h=AR.limpaCod((h=>{try{return decodeURIComponent(h)}catch(_){return h}})(location.hash.slice(1)));ecraCodigo('',h);if(h.length===6)abrir(h);
})();
</script>
